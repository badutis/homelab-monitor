#!/usr/sbin/nft -f
# homelab-monitor firewall: inbound SSH and the web UI only from the networks
# in /etc/homelab/nftables-lan.nft (generated from LAN_CIDR by homelabctl);
# everything else inbound is dropped. Outbound is open (scraping, updates).

flush ruleset

include "/etc/homelab/nftables-lan.nft"

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    iif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # ICMP (ping, path MTU) and IPv6 neighbour discovery, rate limited.
    ip protocol icmp limit rate 10/second accept
    meta l4proto ipv6-icmp accept

    # DHCP replies and DHCPv6.
    udp sport 67 udp dport 68 accept
    udp sport 547 udp dport 546 accept

    # SSH and HTTP (nginx: homelable and /grafana/) from the LAN only.
    ip saddr $LAN_V4 tcp dport { 22, 80 } accept
    ip6 saddr $LAN_V6 tcp dport { 22, 80 } accept
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
