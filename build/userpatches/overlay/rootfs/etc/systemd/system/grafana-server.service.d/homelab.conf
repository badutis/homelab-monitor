# homelab-monitor settings for Grafana (environment overrides, so the
# packaged grafana.ini stays untouched).
[Unit]
After=victoria-metrics.service homelab-firstboot.service
# Without the admin password from the first boot, Grafana would create its
# database with the default admin/admin; do not start until it exists.
ConditionPathExists=/etc/homelab/grafana-admin.env

[Service]
# Written by homelab-firstboot; used only when Grafana creates its database.
EnvironmentFile=-/etc/homelab/grafana-admin.env
# Bundled plugins: load only the VictoriaMetrics datasource (prometheus) plus
# GRAFANA_PLUGINS; generated by homelabctl.
EnvironmentFile=-/etc/grafana/homelab-plugins.env
# Use the read-only packaged copy of the bundled plugins instead of the
# writable copy in /var/lib/grafana that Grafana would auto-update from the
# internet; versions change only with a new image.
Environment=GF_PATHS_BUNDLED_PLUGINS=/usr/share/grafana/data/plugins-bundled
Environment=GF_PLUGINS_PREINSTALL_AUTO_UPDATE=false
# Behind nginx at /grafana/, localhost only.
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_HTTP_PORT=3000
Environment=GF_SERVER_ROOT_URL=%%(protocol)s://%%(domain)s/grafana/
Environment=GF_SERVER_SERVE_FROM_SUB_PATH=true
# Look and home page.
Environment=GF_USERS_DEFAULT_THEME=dark
Environment=GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/usr/share/homelab/dashboards/homelab-overview.json
# No phoning home, no plugin downloads at start-up, no anonymous access.
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_PLUGINS_PREINSTALL_DISABLED=true
Environment=GF_AUTH_ANONYMOUS_ENABLED=false
Environment=GF_SECURITY_DISABLE_GRAVATAR=true
Environment=GF_SECURITY_COOKIE_SAMESITE=strict
Environment=GF_USERS_ALLOW_SIGN_UP=false
