name: release

# Push a tag vX.Y.Z (or vX.Y.Z-rc.N) on a commit of main: builds the image
# with the GPL source archives, adds the Grafana source, attests build
# provenance and creates a DRAFT GitHub release for review.

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Tag is a version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag '$TAG' is not on main; only verified code is released"
            exit 1
          fi

  image:
    needs: check
    uses: ./.github/workflows/build-image.yml # zizmor: ignore[self-repository]
    with:
      release-sources: true
    permissions:
      contents: read
      security-events: write

  grafana-source:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Archive the Grafana source (AGPL-3.0)
        run: |
          scripts/fetch-source.sh grafana-src "$RUNNER_TEMP/grafana"
          version="$(grep -E '^grafana[[:space:]]' sources.lock | tr -s '[:space:]' '\n' | sed -n 's/^version=//p')"
          mkdir -p "$RUNNER_TEMP/out"
          git -C "$RUNNER_TEMP/grafana" archive --format=tar.gz --prefix="grafana-$version/" \
            -o "$RUNNER_TEMP/out/grafana-$version-source.tar.gz" HEAD

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grafana-source
          path: ${{ runner.temp }}/out/
          compression-level: 0
          retention-days: 14

  publish:
    needs: [image, grafana-source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      id-token: write # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homelab-monitor-image-${{ github.sha }}
          path: assets

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grafana-source
          path: assets

      - name: Name the image and write checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd assets
          rm -f trivy.sarif # uploaded to code scanning, not a release asset
          # Armbian's own name and checksum file -> ours (SHA256SUMS covers all).
          mv -- *.img.xz "homelab-monitor-$TAG-mkspi.img.xz"
          rm -f -- *.img.xz.sha
          sha256sum -- * >SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/release-notes.sh "$TAG" assets >notes.md
          prerelease=()
          [[ "$TAG" == *-rc.* ]] && prerelease=(--prerelease)
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "homelab-monitor $TAG" --notes-file notes.md assets/*
