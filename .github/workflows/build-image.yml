name: build-image

on:
  workflow_dispatch:
  # Called by the release workflow, with the GPL source archives.
  workflow_call:
    inputs:
      release-sources:
        description: Also archive the kernel, U-Boot and TF-A sources
        type: boolean
        default: false
  # Weekly rebuild and rescan: new CVEs are published even when nothing here
  # changes.
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    paths:
      - .github/workflows/build-image.yml
      - build/**
      - scripts/**
      - sources.lock
  push:
    branches: [develop]
    paths:
      - .github/workflows/build-image.yml
      - build/**
      - scripts/**
      - sources.lock

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  # Supersede older builds of a pull request; never cancel a develop build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload the image scan to code scanning
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tags, for the version written into the image

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Free disk space
        run: |
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null
          df -h / /mnt

      - name: Prepare work directory on /mnt
        run: |
          sudo mkdir -p /mnt/work
          sudo chown "$(id -u):$(id -g)" /mnt/work

      - name: Build image
        id: build
        env:
          RELEASE_SOURCES: ${{ inputs.release-sources && 'yes' || 'no' }}
        run: scripts/build-image.sh /mnt/work

      - name: List installed packages
        run: |
          image="$(ls /mnt/work/out/*.img.xz)"
          scripts/with-image-rootfs.sh "$image" scripts/image-manifest.sh /mnt/work/out/packages.tsv

      - name: Install Trivy
        run: scripts/install-trivy.sh

      - name: Scan image (report only)
        run: |
          image="$(ls /mnt/work/out/*.img.xz)"
          scripts/scan-image.sh "$image" /mnt/work/out
          cat /mnt/work/out/trivy-summary.md >>"$GITHUB_STEP_SUMMARY"

      - name: Upload scan to GitHub code scanning
        # Pull requests only show the summary; the Security tab tracks develop.
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@8498dc4c2b27cdd99baf0f87955b29ebbf30c78d # v4.39.1
        with:
          sarif_file: /mnt/work/out/trivy.sarif
          category: image

      - name: Test image configuration
        run: |
          set -o pipefail
          image="$(ls /mnt/work/out/*.img.xz)"
          scripts/with-image-rootfs.sh "$image" scripts/test-image.sh | tee /mnt/work/out/image-tests.txt
          { echo '### Image configuration tests'; echo '```'; tail -n 1 /mnt/work/out/image-tests.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

      - name: Disk usage after build
        if: always()
        run: df -h / /mnt

      - name: Collect logs after failure
        if: failure()
        run: |
          mkdir -p /mnt/work/out
          if [ -d /mnt/work/armbian-mkspi/output/logs ]; then
            sudo tar -C /mnt/work/armbian-mkspi/output -czf /mnt/work/out/build-logs.tar.gz logs
            sudo chown "$(id -u):$(id -g)" /mnt/work/out/build-logs.tar.gz
          fi

      - name: Upload image
        # Also when a scan or image test failed, to inspect it; the failed
        # check still keeps the image out of main.
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homelab-monitor-image-${{ github.sha }}
          path: |
            /mnt/work/out/*.img.xz
            /mnt/work/out/*.img.xz.sha
            /mnt/work/out/armbian-mkspi-src.tar.gz
            /mnt/work/out/BUILD-INFO.txt
            /mnt/work/out/trivy-report.json
            /mnt/work/out/trivy-summary.md
            /mnt/work/out/trivy.sarif
            /mnt/work/out/sbom.cdx.json
            /mnt/work/out/image-tests.txt
            /mnt/work/out/packages.tsv
            /mnt/work/out/*-source.tar.xz
            /mnt/work/out/SOURCES.txt
          compression-level: 0
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs-${{ github.sha }}
          path: /mnt/work/out/build-logs.tar.gz
          if-no-files-found: ignore
          retention-days: 14
